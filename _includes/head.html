<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  {% assign description = page.description | default: site.description %}
  {% if description %}
  <meta name="description" content="{{ description | escape }}" />
  {% endif %}
  {% if page.keywords %}
  <meta name="keywords" content="{{ page.keywords | escape }}" />
  {% endif %}

  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}" />
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}" />

  <link
    href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Raleway:300,300i,400,400i,500,500i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
    rel="stylesheet" />

  <link rel="stylesheet" href="{{ '/assets/vendor/bootstrap/css/bootstrap.min.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/vendor/icofont/icofont.min.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/vendor/owl.carousel/assets/owl.carousel.min.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/vendor/boxicons/css/boxicons.min.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/vendor/venobox/venobox.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/vendor/aos/aos.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />

  {% if page.extra_styles %}
    {% for stylesheet in page.extra_styles %}
  <link rel="stylesheet" href="{{ stylesheet | relative_url }}" />
    {% endfor %}
  {% endif %}

  {% if site.hotjar.id and site.hotjar.sv %}
  <!-- Hotjar Tracking Code -->
  <script>
    (function (h, o, t, j, a, r) {
      h.hj = h.hj || function () { (h.hj.q = h.hj.q || []).push(arguments) };
      h._hjSettings = { hjid: {{ site.hotjar.id }}, hjsv: {{ site.hotjar.sv }} };
      a = o.getElementsByTagName('head')[0];
      r = o.createElement('script'); r.async = 1;
      r.src = t + h._hjSettings.hjid + j + h._hjSettings.hjsv;
      a.appendChild(r);
    })(window, document, 'https://static.hotjar.com/c/hotjar-', '.js?sv=');
  </script>
  {% endif %}
</head>
