{% assign cache_bust = site.time | date: '%s' %}
<script src="{{ '/assets/vendor/aos/aos.js' | relative_url }}?v={{ cache_bust }}"></script>
<script type="module" src="{{ '/assets/js/main.js' | relative_url }}?v={{ cache_bust }}"></script>

{% if page.extra_scripts %}
  {% for script in page.extra_scripts %}
<script type="module" src="{{ script | relative_url }}?v={{ cache_bust }}"></script>
  {% endfor %}
{% endif %}
